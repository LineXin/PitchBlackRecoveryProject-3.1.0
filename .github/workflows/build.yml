name: PBRP for blossom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📢 Telegram Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TG_CHAT_ID }}" \
          -d text="🚀 PBRP build started!"

      - name: 🧹 Cleanup
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo apt-get clean

      - name: 📦 Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            python3 \
            python-is-python3 \
            openjdk-11-jdk \
            bc \
            bison \
            build-essential \
            zip \
            ccache \
            flex \
            libssl-dev \
            libncurses5-dev \
            lzop \
            libxml2-utils \
            xsltproc \
            unzip \
            wget

      - name: ⚙️ Setup repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 📁 Create workspace
        run: |
          mkdir -p ~/pbrp

      - name: 🔄 Repo init
        run: |
          cd ~/pbrp
          repo init -u https://github.com/PitchBlackRecoveryProject/manifest_pb -b android-12.1

      - name: 📥 Repo sync
        run: |
          cd ~/pbrp
          repo sync -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j4

      - name: 📢 Sync Done
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TG_CHAT_ID }}" \
          -d text="📥 Repo sync completed!"

      - name: 🌳 Clone device tree
        run: |
          cd ~/pbrp
          git clone https://github.com/blossomat24/recovery_device_xiaomi_blossom device/xiaomi/blossom

      - name: 📂 Check tree
        run: |
          cd ~/pbrp/device/xiaomi/blossom
          ls -la

      - name: ⚙️ Setup build env
        run: |
          cd ~/pbrp
          source build/envsetup.sh
          lunch pb_blossom-eng

      - name: 🔨 Build PBRP
        run: |
          cd ~/pbrp
          source build/envsetup.sh
          mka pbrp -j4

      - name: 📦 Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-Recovery
          path: ~/pbrp/out/target/product/blossom/recovery.img

      - name: ✅ Telegram Success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TG_CHAT_ID }}" \
          -d text="✅ Build completed successfully!"

      - name: ❌ Telegram Failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TG_CHAT_ID }}" \
          -d text="❌ Build failed!"

      - name: 🧾 Final info
        run: |
          echo "Build finished at $(date)"
          df -h
