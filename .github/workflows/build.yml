name: PBRP for blossom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📦 Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl python3 python-is-python3 \
            openjdk-11-jdk bc bison build-essential \
            zip ccache flex libssl-dev libncurses5-dev \
            lzop libxml2-utils xsltproc unzip wget

      - name: ⚙️ Setup repo
        run: |
          mkdir -p ~/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 📁 Create workspace
        run: |
          mkdir -p ~/pbrp

      - name: 🔄 Repo init
        run: |
          cd ~/pbrp
          repo init \
            -u https://github.com/PitchBlackRecoveryProject/manifest_pb \
            -b android-12.1

      - name: 📥 Repo sync
        run: |
          cd ~/pbrp
          repo sync -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j4

      - name: 🌳 Clone blossom tree properly
        run: |
          cd ~/pbrp

          mkdir -p device/xiaomi

          git clone \
            --depth=1 \
            https://github.com/blossomat24/recovery_device_xiaomi_blossom \
            device/xiaomi/blossom

      - name: 📂 Check cloned files
        run: |
          cd ~/pbrp/device/xiaomi/blossom

          echo "=== TREE CONTENT ==="
          ls -la

          echo "=== MK FILES ==="
          find . -name "*.mk"

      - name: 🔧 Generate AndroidProducts.mk
        run: |
          cd ~/pbrp/device/xiaomi/blossom

          if [ ! -f AndroidProducts.mk ]; then
            echo 'PRODUCT_MAKEFILES := $(LOCAL_DIR)/omni_blossom.mk' > AndroidProducts.mk
            echo 'COMMON_LUNCH_CHOICES := omni_blossom-eng' >> AndroidProducts.mk
          fi

      - name: 🔨 Build recovery
        run: |
          cd ~/pbrp

          source build/envsetup.sh

          lunch omni_blossom-eng

          mka pbrp -j4

      - name: 📦 Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-Recovery
          path: |
            ~/pbrp/out/target/product/blossom/*.img
