name: Build PBRP • blossom
on: 
  workflow_dispatch:
    inputs:
      DT_BRANCH:
        description: "Device tree branch"
        required: true
        default: "android-12.1"
      PBRP_BRANCH:
        description: "PBRP manifest branch"
        required: true
        default: "android-12.1"
      LUNCH_TARGET:
        description: "Lunch target (без суффикса)"
        required: true
        default: "twrp_blossom"

env:
  MANIFEST_REPO: "https://github.com/LineXin/PitchBlackRecoveryProject-3.1.0"
  DT_REPO:       "https://github.com/LineXin/recovery_device_xiaomi_blossom"
  DT_BRANCH:     ${{ github.event.inputs.DT_BRANCH }}
  PBRP_BRANCH:   ${{ github.event.inputs.PBRP_BRANCH }}
  LUNCH_TARGET:  ${{ github.event.inputs.LUNCH_TARGET }}
  DEVICE:        "blossom"
  MANUFACTURER:  "xiaomi"
  DT_PATH:       "device/xiaomi/blossom"

jobs:
  build:
    name: "PBRP • blossom"
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    permissions:
      contents: write

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo apt-get remove -yq \
            dotnet-* aspnetcore-* llvm-* clang-* \
            google-cloud-* azure-cli powershell \
            firefox mono-* ghc-* || true
          sudo apt-get autoremove -yq && sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq \
            git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python3-pip \
            libncurses5 libncurses5-dev schedtool lzop \
            pngcrush imagemagick rsync ccache \
            gcc-multilib g++-multilib libssl-dev

      - name: Set up repo tool
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.email "ci@pbrp.build"
          git config --global user.name  "PBRP CI"
          git config --global color.ui   false

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/pbrp/.ccache
          key: ccache-pbrp-blossom-${{ env.PBRP_BRANCH }}-${{ github.run_id }}
          restore-keys: ccache-pbrp-blossom-${{ env.PBRP_BRANCH }}-

      - name: Configure ccache
        run: |
          mkdir -p /home/runner/pbrp/.ccache
          export CCACHE_DIR=/home/runner/pbrp/.ccache
          ccache -M 10G
          ccache -o compression=true
          ccache -z

      - name: repo init
        run: |
          mkdir -p ~/pbrp && cd ~/pbrp
          repo init \
            --depth=1 \
            -u "$MANIFEST_REPO" \
            -b "$PBRP_BRANCH" \
            --groups="default,-mips,-darwin,-notdefault"

      - name: repo sync
        run: |
          cd ~/pbrp
          repo sync -c -j$(nproc --all) \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune

      - name: Clone device tree
        run: |
          git clone \
            --depth=1 \
            --branch "$DT_BRANCH" \
            "$DT_REPO" \
            ~/pbrp/$DT_PATH

      - name: Inspect device tree
        run: |
          DT=~/pbrp/$DT_PATH
          echo "=== DT files ==="
          ls -la "$DT/"

      - name: Build PBRP
        run: |
          cd ~/pbrp
          export USE_CCACHE=1
          export CCACHE_DIR=/home/runner/pbrp/.ccache
          export CCACHE_EXEC=$(which ccache)
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          echo "=== lunch: ${LUNCH_TARGET}-eng ==="
          lunch "${LUNCH_TARGET}-eng"
          echo "=== Building recoveryimage ==="
          mka pbrp -j$(nproc --all) 2>&1 | tee ~/build.log || true
          echo ""
          echo "========================================"
          echo "=== ПОСЛЕДНИЕ 100 СТРОК BUILD LOG ==="
          echo "========================================"
          tail -100 ~/build.log

      - name: Find output files
        if: always()
        run: |
          echo "=== recovery.img в out/ ==="
          find ~/pbrp/out -name "recovery.img" 2>/dev/null || echo "НЕ НАЙДЕН"

      - name: Collect artifacts
        if: always()
        id: out
        run: |
          RECOVERY_IMG=$(find ~/pbrp/out -name "recovery.img" 2>/dev/null | head -n1 || echo "")
          PBRP_ZIP=$(find ~/pbrp/out -name "PBRP-*.zip" 2>/dev/null | head -n1 || echo "")
          echo "recovery_img=${RECOVERY_IMG}" >> "$GITHUB_OUTPUT"
          echo "pbrp_zip=${PBRP_ZIP}"         >> "$GITHUB_OUTPUT"

      - name: Upload recovery.img
        if: ${{ steps.out.outputs.recovery_img != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-blossom-recovery-img
          path: ${{ steps.out.outputs.recovery_img }}
          retention-days: 14

      - name: Upload PBRP ZIP
        if: ${{ steps.out.outputs.pbrp_zip != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-blossom-zip
          path: ${{ steps.out.outputs.pbrp_zip }}
          retention-days: 14

      - name: Create Release
        if: ${{ steps.out.outputs.recovery_img != '' || steps.out.outputs.pbrp_zip != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: PBRP-blossom-${{ github.run_id }}
          name: PBRP Build ${{ github.run_number }}
          files: |
            ${{ steps.out.outputs.recovery_img }}
            ${{ steps.out.outputs.pbrp_zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
