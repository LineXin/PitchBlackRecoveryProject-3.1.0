name: Build PBRP for blossom

on:
  workflow_dispatch: # Позволяет запускать сборку вручную по кнопке

jobs:
  build:
    runs-on: ubuntu-22.04 # Используем 22.04, она стабильнее для старых веток Android
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Clean up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        
    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

    - name: Install Repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo cp ~/bin/repo /usr/local/bin/repo

    - name: Initialize and Sync PBRP Manifest
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "LineXin"
        git config --global user.email "linexin@github.com"
        # Используем ветку android-11.0
        repo init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pb -b android-11.0
        # Быстрая синхронизация без лишней истории
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd workspace
        # ВАЖНО: Замени ссылку ниже на свой репозиторий с готовым деревом для blossom!
        # git clone https://github.com/ТВОЙ_GITHUB/device_xiaomi_blossom -b main device/xiaomi/blossom

    - name: Build PitchBlack
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        # Убедись, что pbrp_blossom совпадает с названием в твоем pbrp_blossom.mk
        lunch pbrp_blossom-eng
        mka pbrp

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: PBRP-blossom-Unoficcial
        # Путь к готовому zip-архиву (может немного отличаться в зависимости от дерева)
        path: workspace/out/target/product/blossom/PitchBlack*.zip
