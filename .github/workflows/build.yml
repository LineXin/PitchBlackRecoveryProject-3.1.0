name: PBRP Builder

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 360

```
steps:
  - name: Start message
    run: |
      echo "Build started"

  - name: Install dependencies
    run: |
      sudo apt update
      sudo apt install -y git curl python3 python-is-python3 repo openjdk-11-jdk bc bison build-essential zip ccache flex libssl-dev libncurses5-dev lzop libxml2-utils xsltproc unzip

  - name: Setup repo
    run: |
      mkdir -p ~/bin
      curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
      chmod +x ~/bin/repo
      echo "$HOME/bin" >> $GITHUB_PATH

  - name: Init
    run: |
      mkdir ~/pbrp
      cd ~/pbrp
      repo init -u https://github.com/PitchBlackRecoveryProject/manifest_pb -b android-12.1

  - name: Sync
    run: |
      cd ~/pbrp
      repo sync -c -j$(nproc) --no-clone-bundle --no-tags

  - name: Clone device
    run: |
      cd ~/pbrp
      git clone https://github.com/blossomat24/recovery_device_xiaomi_blossom device/xiaomi/blossom

  - name: Build
    run: |
      cd ~/pbrp
      source build/envsetup.sh
      lunch pb_blossom-eng
      mka pbrp

  - name: Upload
    uses: actions/upload-artifact@v4
    with:
      name: recovery
      path: ~/pbrp/out/target/product/blossom/recovery.img
