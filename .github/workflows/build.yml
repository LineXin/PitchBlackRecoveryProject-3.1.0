name: Build PBRP for blossom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        
    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

    - name: Install Repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo cp ~/bin/repo /usr/local/bin/repo

    - name: Sync PBRP Manifest
      run: |
        mkdir workspace && cd workspace
        git config --global user.name "LineXin"
        git config --global user.email "linexin@github.com"
        repo init --depth=1 -u https://github.com/LineXin/PitchBlackRecoveryProject-3.1.0 -b android-12.1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd workspace
        # Клонируем дерево. Если ветка не main, Git сам подхватит дефолтную.
        git clone https://github.com/blossomat24/recovery_device_xiaomi_blossom device/xiaomi/blossom

    - name: Build PitchBlack
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        export BUILD_BROKEN_DUP_RULES=true 
        source build/envsetup.sh
        lunch pbrp_blossom-eng
        mka pbrp -j$(nproc --all)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PBRP-blossom-Unofficial
        path: workspace/out/target/product/blossom/PitchBlack*.zip
